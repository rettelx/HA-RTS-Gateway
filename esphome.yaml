# =============================================================================
# RTS Gateway - ESP32 + CC1101 (ESPHome 2026.10+)
#
# TX: HA sends the RTS timings through the native `radio_frequency` entity
#     (ir_rf_proxy) -> remote_transmitter bit-bangs the GDO0 pin and the
#     CC1101 ("async serial" mode) modulates its 433.42 MHz carrier (OOK).
# RX: the CC1101 demodulates OOK, GDO2 outputs the baseband signal,
#     remote_receiver captures the timings and the local `rts_gateway`
#     component decodes the frames into the `esphome.rts_gateway_rx` event.
#
# Two-pin wiring (recommended by the cc1101 docs): GDO0 -> ${pin_gdo0}
# for transmit, GDO2 -> ${pin_gdo2} for receive.
#
# WARNING: the cc1101 component must NOT declare gdo0_pin on ESP32 in OOK:
# its pin_mode() call breaks the RMT -> pad link and transmissions go out
# silently, without any error (esphome/esphome#16876). Keep the GDO0 wire
# connected: remote_transmitter/remote_receiver drive the pin through
# allow_other_uses.
#
# Board variant: change the board_package line below (see esphome_boards/).
# =============================================================================

substitutions:
  name: rts-gateway
  friendly_name: RTS Gateway
  # <<< Change this line to match your board >>>
  board_package: esphome_boards/esp32-s3-zero.yaml

packages:
  board: !include ${board_package}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # Keep the CC1101 in permanent OOK receive (GDO0 = baseband output)
      - cc1101.begin_rx: cc1101_radio

# Local RTS decoder (esphome_components/rts_gateway)
external_components:
  - source:
      type: local
      path: esphome_components
    components: [rts_gateway]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

logger:

# =============================================================================
# SPI + CC1101 (OOK 433.42 MHz - RTS is NOT 433.92 MHz)
# =============================================================================
spi:
  clk_pin: ${pin_sck}
  miso_pin: ${pin_miso}
  mosi_pin: ${pin_mosi}

cc1101:
  id: cc1101_radio
  cs_pin: ${pin_csn}
  # No gdo0_pin here: see the warning at the top of this file.
  frequency: 433.42MHz
  modulation_type: ASK/OOK
  output_power: 11

# =============================================================================
# Transmit: remote_transmitter bit-bangs GDO0 (dedicated to TX), the CC1101
# derives the OOK envelope from it in "async serial" TX mode.
# =============================================================================
remote_transmitter:
  - id: rts_tx
    pin: ${pin_gdo0}   # dedicated TX pin (the receiver listens on GDO2)
    carrier_duty_percent: 100%   # required for RF transmission
    non_blocking: true
    on_transmit:
      then:
        # Switch the CC1101 to TX before every transmission
        - logger.log: "TX: switching CC1101 to transmit"
        - cc1101.begin_tx: cc1101_radio
    on_complete:
      then:
        # Back to receive after every transmission
        - logger.log: "TX done, back to receive"
        - cc1101.begin_rx: cc1101_radio

# =============================================================================
# Receive: OOK baseband from the CC1101 on GDO2 (two-pin wiring)
# =============================================================================
remote_receiver:
  - id: rf_rx
    pin:
      number: ${pin_gdo2}
      mode: input
    tolerance: 25%
    # Uncomment to debug (logs every captured raw burst):
    # dump: raw

# =============================================================================
# RTS decoder: publishes every received frame to Home Assistant
# =============================================================================
rts_gateway:
  id: rts_decoder
  receiver_id: rf_rx
  on_command:
    then:
      - homeassistant.event:
          event: esphome.rts_gateway_rx
          data:
            address: !lambda |-
              return to_string(address);
            command: !lambda |-
              return to_string(static_cast<int>(command));
            rolling_code: !lambda |-
              return to_string(static_cast<int>(rolling_code));
            bits: !lambda |-
              return to_string(static_cast<int>(bits));
            step: !lambda |-
              return to_string(static_cast<int>(step));
            device: ${name}

# =============================================================================
# radio_frequency entity exposed to Home Assistant (native transmitter).
# Transmissions go through rts_tx: its on_transmit trigger switches the
# CC1101 to TX (covers both the HA proxy and direct actions).
# =============================================================================
radio_frequency:
  - platform: ir_rf_proxy
    id: rts_radio
    name: "Radio 433.42 MHz"
    frequency: 433420000
    remote_transmitter_id: rts_tx
