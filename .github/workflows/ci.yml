name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests, typing, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Tests
        run: pytest tests/ -q
      - name: Strict typing
        run: mypy custom_components/rts_gateway
      - name: Lint
        run: ruff check tests custom_components/rts_gateway

  esphome:
    name: ESPHome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ESPHome
        run: pip install esphome==2026.10.0
      - name: Fill in the secrets template
        run: |
          cp secrets.yaml.example secrets.yaml
          sed -i "s|api_key: .*|api_key: $(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')|" secrets.yaml
      - name: Validate the configuration
        run: esphome config esphome.yaml
