# ESP32-C6 (DevKitC-1)
# C6 strapping pins (GPIO4, 5, 8, 9, 15) are avoided.
# Note: the Arduino framework is not available for the C6 (ESP-IDF only).
substitutions:
  pin_sck: GPIO18
  pin_miso: GPIO19
  pin_mosi: GPIO20
  pin_csn: GPIO21
  pin_gdo0: GPIO6
  pin_gdo2: GPIO11  # GDO2 = RX baseband

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
