# ESP32-S3 (DevKitC-1)
# GPIO0 (CSN) and GPIO3 (GDO0) are S3 strapping pins: they work with a
# CC1101 connected (BOOT pull-up on GPIO0). If the board refuses to boot,
# move CSN to GPIO10 and GDO0 to GPIO7 and update this file.
substitutions:
  pin_sck: GPIO4
  pin_miso: GPIO5
  pin_mosi: GPIO6
  pin_csn: GPIO0
  pin_gdo0: GPIO3
  pin_gdo2: GPIO10  # GDO2 = RX baseband

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino
