- [x] `docs-supported-functions`: Document supported functionality — [README.md](README.md)
- [x] `docs-troubleshooting`: Document troubleshooting — [README.md](README.md)
- [x] `docs-use-cases`: Document use cases — [README.md](README.md)
- [x] `dynamic-devices`: Add new devices automatically — [__init__.py](custom_components/rts_gateway/__init__.py)
